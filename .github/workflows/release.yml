name: Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    # Self-hosted runner. Confirm these labels match Rick's runner and keep them
    # in sync with AGENTS.md. Fallback: swap to `ubuntu-latest` if the runner is
    # offline.
    runs-on: [self-hosted, linux, android]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The wrapper jar is not committed yet, so CI provisions Gradle directly.
      # Once the wrapper jar is committed, this can switch to ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          gradle assembleRelease
          -PversionCode=${{ github.run_number }}
          -PversionName=v1.0.${{ github.run_number }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LocalTube v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
